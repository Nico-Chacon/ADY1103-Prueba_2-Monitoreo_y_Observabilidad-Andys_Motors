server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Catalogo y disponibilidad de vehiculos (GET) -> get-vehicles
    location /api/vehicles {
        proxy_pass http://get-vehicles:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Visitas: POST agenda (create-visit); GET/DELETE consultan o cancelan (manage-visits)
    location /api/visits {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        if ($request_method = POST) { proxy_pass http://create-visit:3002; }
        proxy_pass http://manage-visits:3004;
    }

    # Solicitudes de contacto (POST) -> create-contact
    location /api/contacts {
        proxy_pass http://create-contact:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

